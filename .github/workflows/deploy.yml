name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:check
      - run: pnpm images:verify
      - run: pnpm test
      - run: pnpm generate
        env:
          NUXT_PUBLIC_IMAGE_MODE: local
          NUXT_SITE_URL: ${{ vars.SITE_URL }}
      - run: pnpm seo:audit
        env:
          NUXT_SITE_URL: ${{ vars.SITE_URL }}
      - name: Upload release
        uses: easingthemes/ssh-deploy@v5
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          SOURCE: .output/public/
          TARGET: /var/www/blog/incoming/
      - name: Publish or roll back
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            bash /var/www/blog/bin/publish.sh /var/www/blog/incoming ${{ vars.SITE_URL }}
