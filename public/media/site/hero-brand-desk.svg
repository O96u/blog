<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none" role="img" aria-label="Engineering workspace">
  <defs>
    <linearGradient id="desk-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="45%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
    <linearGradient id="desk-glow" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="desk-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="desk-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#2563eb" stroke-opacity="0.08"/>
    </pattern>
    <filter id="desk-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#171717" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#desk-sky)"/>
  <rect width="1280" height="720" fill="url(#desk-grid)"/>
  <ellipse cx="980" cy="120" rx="280" ry="160" fill="url(#desk-glow)"/>
  <rect x="140" y="468" width="1000" height="36" rx="8" fill="#d6d3d1"/>
  <rect x="220" y="504" width="140" height="120" rx="10" fill="#cfc7be"/>
  <rect x="920" y="504" width="140" height="120" rx="10" fill="#cfc7be"/>
  <g filter="url(#desk-shadow)">
