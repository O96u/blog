    <rect x="328" y="148" width="624" height="324" rx="12" fill="url(#desk-screen)"/>
    <rect x="356" y="176" width="148" height="10" rx="4" fill="#2563eb"/>
    <rect x="356" y="204" width="260" height="8" rx="3" fill="#64748b"/>
    <rect x="356" y="228" width="220" height="8" rx="3" fill="#475569"/>
    <rect x="356" y="260" width="120" height="8" rx="3" fill="#334155"/>
    <path d="M356 296 H520" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M356 320 H440" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <rect x="356" y="348" width="180" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
    <path d="M368 372 h80 M368 388 h120 M368 404 h64" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <circle cx="880" cy="200" r="36" fill="#2563eb" fill-opacity="0.22" stroke="#2563eb" stroke-opacity="0.5"/>
    <path d="M864 200 h32 M880 184 v32" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <rect x="860" y="52" width="160" height="48" rx="12" fill="#ffffff" fill-opacity="0.88" stroke="#cbd5e1"/>
  <text x="878" y="82" fill="#525252" font-family="Consolas, monospace" font-size="15">nuxt generate</text>
  <rect x="200" y="80" width="120" height="8" rx="4" fill="#a3a3a3" fill-opacity="0.35"/>
